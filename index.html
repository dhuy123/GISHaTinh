<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS - Phường xã Hà Tĩnh (MapLibre GL JS)</title>

    <link rel="stylesheet" href="./libs/maplibre/maplibre-gl.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            min-height: 0;
            background: #e8eef0;
        }

        .maplibregl-ctrl-group button {
            width: 30px;
            height: 30px;
        }

        .map-style-control {
            background: #fff;
            padding: 8px;
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, .35);
            font: 13px Arial, sans-serif;
            min-width: 145px;
        }

        .map-style-control strong {
            display: block;
            margin: 0 0 6px;
        }

        .map-style-control label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 5px 0;
            cursor: pointer;
        }

        .custom-popup {
            width: 350px;
            max-width: 72vw;
            font-family: Arial, sans-serif;
        }

        .popup-title {
            background: #198754;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            padding: 12px 38px 12px 14px;
            border-radius: 8px 8px 0 0;
        }

        .popup-body {
            background: #fff;
            max-height: 55vh;
            overflow-y: auto;
        }

        .attribute {
            display: grid;
            grid-template-columns: 125px minmax(0, 1fr);
            min-height: 36px;
            border-bottom: 1px solid #eee;
            align-items: start;
        }

        .attribute-key {
            padding: 8px 9px 8px 12px;
            color: #198754;
            font-size: 13px;
            font-weight: 700;
        }

        .attribute-value {
            padding: 8px 12px 8px 4px;
            color: #444;
            font-size: 13px;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .maplibregl-popup-content {
            padding: 0;
            border-radius: 8px;
            overflow: hidden;
        }

        .maplibregl-popup-close-button {
            z-index: 2;
            color: #fff;
            background: rgba(0, 0, 0, .18);
            border-radius: 50%;
            width: 27px;
            height: 27px;
            right: 7px;
            top: 7px;
            font-size: 21px;
        }

        .maplibregl-popup-close-button:hover {
            color: #fff;
            background: rgba(0, 0, 0, .35);
        }

        .maplibregl-popup-tip {
            border-top-color: #fff;
        }

        .legend-panel {
            position: absolute;
            top: 0;
            right: 45px;
            width: 380px;
            max-height: 80vh;
            overflow: auto;
            background: white;
            padding: 8px;
            border-radius: 5px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        .legend-panel img {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: auto;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <!-- MapLibre GL JS dạng ES module. Đường dẫn này cần tồn tại trong thư mục libs/maplibre. -->
    <script type="module">
        import * as maplibregl from './libs/maplibre/maplibre-gl.mjs';

        const GEOJSON_URL = './PhuongXaHaTinh.geojson';
        const SOURCE_ID = 'phuong-xa';
        const LABEL_SOURCE_ID = 'phuong-xa-label-source';
        const FILL_LAYER = 'phuong-xa-fill';
        const LINE_LAYER = 'phuong-xa-line';
        // const HOVER_LAYER = 'phuong-xa-hover';
        const LABEL_LAYER = 'phuong-xa-labels';

        // Nền địa hình Hillshade
        const TERRAIN_SOURCE_ID = 'terrain-vietnam-source';
        const TERRAIN_LAYER_ID = 'terrain-vietnam-layer';

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://lifegis-api.lifetex.vn/style.json',
            center: [105.9, 18.3],
            zoom: 8,
            attributionControl: false
        });

        // Theo dõi kích thước container để MapLibre luôn vẽ kín khung bản đồ.
        const mapContainer = document.getElementById('map');
        const mapResizeObserver = new ResizeObserver(() => {
            map.resize();
        });
        mapResizeObserver.observe(mapContainer);

        // Cập nhật lại kích thước sau khi trình duyệt hoàn tất bố cục.
        requestAnimationFrame(() => map.resize());

        map.addControl(
            new maplibregl.NavigationControl({ visualizePitch: true }),
            'top-right'
        );


        map.on('load', () => {
            // Lưu các layer của bản đồ LifeGIS
            const defaultLayers = map.getStyle().layers.map(layer => layer.id);

            // Thêm Hillshade
            map.addSource(TERRAIN_SOURCE_ID, {
                type: 'raster',
                tiles: [
                    'https://lifegis-api.lifetex.vn/data/terrain_vietnam/{z}/{x}/{y}.png'
                ],
                tileSize: 256
            });

            map.addLayer({
                id: TERRAIN_LAYER_ID,
                type: 'raster',
                source: TERRAIN_SOURCE_ID,
                layout: { visibility: 'none' },
                paint: { 'raster-opacity': 0.65 }
            }, map.getStyle().layers[0].id);

            // Control chọn lớp bản đồ
            class LayersControl {
                onAdd(map) {
                    const div = document.createElement('div');
                    div.className = 'maplibregl-ctrl maplibregl-ctrl-group';
                    div.style.cssText = `
                background: white;
                padding: 8px 12px;
                font-size: 12px;
            `;

                    div.innerHTML = `
                <strong> ▧ Lớp bản đồ</strong> <br>
                <label>
                    <input type="checkbox" id="default-map" checked>
                    LifeGIS
                </label><br>

                <label>
                    <input type="checkbox" id="terrain-map">
                    Địa hình
                </label>
            `;

                    // Bật/tắt LifeGIS
                    div.querySelector('#default-map').onchange = e => {
                        defaultLayers.forEach(id => {
                            map.setLayoutProperty(
                                id,
                                'visibility',
                                e.target.checked ? 'visible' : 'none'
                            );
                        });
                    };

                    // Bật/tắt Hillshade
                    div.querySelector('#terrain-map').onchange = e => {
                        map.setLayoutProperty(
                            TERRAIN_LAYER_ID,
                            'visibility',
                            e.target.checked ? 'visible' : 'none'
                        );
                    };

                    return div;
                }

                onRemove() { }
            }

            map.addControl(new LayersControl(), 'top-right');
        });


        class LegendControl {
            onAdd(map) {
                const div = document.createElement('div');
                div.className = 'maplibregl-ctrl maplibregl-ctrl-group';

                div.innerHTML = `
            <button type="button" title="Chú giải bản đồ">
               ⓘ
            </button>

            <div class="legend-panel" style="display:none;">
                <img src="/Legend/ChuGiai.jpg" alt="Chú giải bản đồ">
            </div>
        `;

                const button = div.querySelector('button');
                const panel = div.querySelector('.legend-panel');

                button.onclick = () => {
                    panel.style.display =
                        panel.style.display === 'none' ? 'block' : 'none';
                };

                return div;
            }

            onRemove() { }
        }

        map.addControl(new LegendControl(), 'top-right');


        map.addControl(
            new maplibregl.ScaleControl({
                maxWidth: 120,
                unit: 'metric'
            }),
            'bottom-left'
        );

        const fieldLabels = {
            ma_xa: 'Mã xã',
            ten_xa: 'Tên xã',
            sap_nhap: 'Sáp nhập',
            tru_so: 'Trụ sở',
            loai: 'Loại đơn vị',
            dtich_km2: 'Diện tích',
            dan_so: 'Dân số',
            matdo_km2: 'Mật độ dân số',
            ma_tinh: 'Mã tỉnh',
            ten_tinh: 'Tỉnh'
        };

        function escapeText(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function formatValue(key, value) {
            if (key === 'dtich_km2' && Number.isFinite(Number(value))) {
                return Number(value).toLocaleString('vi-VN') + ' km²';
            }
            if (key === 'dan_so' && Number.isFinite(Number(value))) {
                return Number(value).toLocaleString('vi-VN') + ' người';
            }
            if (key === 'matdo_km2' && Number.isFinite(Number(value))) {
                return Number(value).toLocaleString('vi-VN') + ' người/km²';
            }
            return String(value);
        }

        function makePopupContent(properties) {
            const wrapper = document.createElement('div');
            wrapper.className = 'custom-popup';

            const title = document.createElement('div');
            title.className = 'popup-title';
            title.textContent = properties.ten_xa || 'Thông tin đơn vị hành chính';
            wrapper.appendChild(title);

            const body = document.createElement('div');
            body.className = 'popup-body';

            Object.entries(properties || {}).forEach(([key, value]) => {
                if (value === null || value === undefined || value === '') return;
                if (['id', 'geom', 'geometry', 'objectid'].includes(key.toLowerCase())) return;

                const row = document.createElement('div');
                row.className = 'attribute';

                const name = document.createElement('div');
                name.className = 'attribute-key';
                name.textContent = fieldLabels[key] || key;

                const val = document.createElement('div');
                val.className = 'attribute-value';
                val.textContent = formatValue(key, value);

                row.append(name, val);
                body.appendChild(row);
            });

            wrapper.appendChild(body);
            return wrapper;
        }

        window.addEventListener('beforeunload', () => {
            mapResizeObserver.disconnect();
        });

        map.on('load', async () => {

            try {
                const response = await fetch(GEOJSON_URL);
                if (!response.ok) {
                    throw new Error(`Không tải được ${GEOJSON_URL} (HTTP ${response.status})`);
                }
                const geojson = await response.json();

                // KIỂM TRA SỐ FEATURE VÀ MÃ XÃ TRÙNG
                const features = geojson.features || [];
                const countByXa = {};

                features.forEach(feature => {
                    const p = feature.properties || {};
                    const key = p.ma_xa || p.ten_xa || 'KHONG_CO_MA';

                    countByXa[key] = (countByXa[key] || 0) + 1;
                });

                console.log('Tổng số feature:', features.length);

                console.table(
                    Object.entries(countByXa)
                        .filter(([key, count]) => count > 1)
                        .map(([key, count]) => ({
                            ma_xa_hoac_ten: key,
                            so_feature: count
                        }))
                );

                map.addSource(SOURCE_ID, {
                    type: 'geojson',
                    data: geojson,
                    generateId: true
                });

                // Tạo bộ dữ liệu riêng cho label: mỗi mã xã chỉ giữ một feature,
                // tránh lặp tên khi GeoJSON có nhiều feature cùng đại diện một xã.
                const uniqueLabelFeatures = [];
                const seenLabelKeys = new Set();
                for (const feature of (geojson.features || [])) {
                    const props = feature.properties || {};
                    const name = String(props.ten_xa || '').trim();
                    if (!name) continue;
                    const code = String(props.ma_xa || '').trim();
                    const key = code ? `ma_xa:${code}` : `ten_xa:${name.toLocaleLowerCase('vi')}`;
                    if (seenLabelKeys.has(key)) continue;
                    seenLabelKeys.add(key);
                    uniqueLabelFeatures.push(feature);
                }
                map.addSource(LABEL_SOURCE_ID, {
                    type: 'geojson',
                    data: { type: 'FeatureCollection', features: uniqueLabelFeatures }
                });

                map.addLayer({
                    id: FILL_LAYER,
                    type: 'fill',
                    source: SOURCE_ID,
                    paint: {
                        'fill-color': '#808000',
                        'fill-opacity': 0.2
                    }
                });

                map.addLayer({
                    id: LINE_LAYER,
                    type: 'line',
                    source: SOURCE_ID,
                    paint: {
                        'line-color': '#198754',
                        'line-width': 2 
                    }
                });

                map.addLayer({
                    id: LABEL_LAYER,
                    type: 'symbol',
                    source: LABEL_SOURCE_ID,
                    minzoom: 0,
                    maxzoom: 10.1,
                    layout: {
                        // Chỉ hiển thị tên xã để tránh nhãn dài/lặp phần loại đơn vị.
                        'text-field': ['coalesce', ['get', 'ten_xa'], ''],
                        'symbol-placement': 'point',
                        'symbol-z-order': 'source',
                        'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'],
                        'text-size': [
                            'interpolate', ['linear'], ['zoom'],
                            10, 10,
                            13, 13,
                            15, 16,
                            20, 16
                        ],
                        'text-anchor': 'center',
                        // Không cho nhãn chồng lên nhãn khác và không bỏ qua vị trí nhãn đã chiếm.
                        'text-allow-overlap': false,
                        'text-ignore-placement': false,
                        'text-optional': true
                    },
                    paint: {
                        'text-color': '#1f2937',
                        'text-halo-color': '#ffffff',
                        'text-halo-width': 1.6,
                        'text-halo-blur': 0.4
                    }
                });


                map.setPaintProperty(FILL_LAYER, 'fill-color', [
                    'case',
                    ['boolean', ['feature-state', 'hover'], false],
                    '#fca5a5',
                    '#808000'
                ]);

                map.setPaintProperty(LINE_LAYER, 'line-color', [
                    'case',
                    ['boolean', ['feature-state', 'hover'], false],
                    '#dc2626',
                    '#198754'
                ]);

                map.setPaintProperty(LINE_LAYER, 'line-width', [
                    'case',
                    ['boolean', ['feature-state', 'hover'], false],
                    4,
                    2
                ]);

                let hoveredFeatureId = null;

                map.on('mousemove', FILL_LAYER, (event) => {
                    map.getCanvas().style.cursor = 'pointer';

                    const feature = event.features && event.features[0];
                    const nextId = feature && feature.id !== undefined
                        ? feature.id
                        : null;

                    if (hoveredFeatureId !== null &&
                        hoveredFeatureId !== nextId) {
                        map.setFeatureState(
                            { source: SOURCE_ID, id: hoveredFeatureId },
                            { hover: false }
                        );
                    }

                    hoveredFeatureId = nextId;

                    if (hoveredFeatureId !== null) {
                        map.setFeatureState(
                            { source: SOURCE_ID, id: hoveredFeatureId },
                            { hover: true }
                        );
                    }
                });

                map.on('mouseleave', FILL_LAYER, () => {
                    map.getCanvas().style.cursor = '';

                    if (hoveredFeatureId !== null) {
                        map.setFeatureState(
                            { source: SOURCE_ID, id: hoveredFeatureId },
                            { hover: false }
                        );
                    }

                    hoveredFeatureId = null;
                });

                // Click vào xã để mở popup thông tin thuộc tính.
                map.on('click', (event) => {
                    const features = map.queryRenderedFeatures(event.point, {
                        layers: [FILL_LAYER, LINE_LAYER, LABEL_LAYER]
                    });

                    if (!features.length) return;

                    // Ưu tiên feature thuộc lớp polygon; nhãn/đường biên cũng có thể được click.
                    const feature = features.find(item => item.layer.id === FILL_LAYER)
                        || features.find(item => item.layer.id === LINE_LAYER)
                        || features[0];

                    if (!feature.properties) return;

                    new maplibregl.Popup({
                        closeButton: true,
                        closeOnClick: true,
                        maxWidth: '380px',
                        offset: 8
                    })
                        .setLngLat(event.lngLat)
                        .setDOMContent(makePopupContent(feature.properties))
                        .addTo(map);
                });

                // Zoom tới toàn bộ phạm vi dữ liệu GeoJSON.
                const bounds = new maplibregl.LngLatBounds();
                function addCoordinates(coords) {
                    if (!Array.isArray(coords)) return;
                    if (typeof coords[0] === 'number' && typeof coords[1] === 'number') {
                        bounds.extend([coords[0], coords[1]]);
                        return;
                    }
                    coords.forEach(addCoordinates);
                }
                (geojson.features || []).forEach(feature => {
                    if (feature.geometry && feature.geometry.coordinates) {
                        addCoordinates(feature.geometry.coordinates);
                    }
                });
                if (!bounds.isEmpty()) {
                    map.fitBounds(bounds, { padding: 35, maxZoom: 13, duration: 0 });
                }
            } catch (error) {
                console.error('Lỗi tải hoặc hiển thị GeoJSON:', error);
                alert('Không thể tải PhuongXaHaTinh.geojson. Hãy kiểm tra tên file, đường dẫn và chạy trang qua HTTP/HTTPS (không mở trực tiếp bằng file://).');
            }
        });
    </script>
</body>

</html>
