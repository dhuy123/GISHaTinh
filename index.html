<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS - Phường xã Hà Tĩnh (MapLibre GL JS)</title>

    <link rel="stylesheet" href="./libs/maplibre/maplibre-gl.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        .maplibregl-ctrl-group button {
            width: 30px;
            height: 30px;
        }

        .map-style-control {
            background: #fff;
            padding: 8px;
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, .35);
            font: 13px Arial, sans-serif;
            min-width: 145px;
        }

        .map-style-control strong {
            display: block;
            margin: 0 0 6px;
        }

        .map-style-control label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 5px 0;
            cursor: pointer;
        }

        .custom-popup {
            width: 350px;
            max-width: 72vw;
            font-family: Arial, sans-serif;
        }

        .popup-title {
            background: #198754;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            padding: 12px 38px 12px 14px;
            border-radius: 8px 8px 0 0;
        }

        .popup-body {
            background: #fff;
            max-height: 55vh;
            overflow-y: auto;
        }

        .attribute {
            display: grid;
            grid-template-columns: 125px minmax(0, 1fr);
            min-height: 36px;
            border-bottom: 1px solid #eee;
            align-items: start;
        }

        .attribute-key {
            padding: 8px 9px 8px 12px;
            color: #198754;
            font-size: 13px;
            font-weight: 700;
        }

        .attribute-value {
            padding: 8px 12px 8px 4px;
            color: #444;
            font-size: 13px;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .maplibregl-popup-content {
            padding: 0;
            border-radius: 8px;
            overflow: hidden;
        }

        .maplibregl-popup-close-button {
            z-index: 2;
            color: #fff;
            background: rgba(0, 0, 0, .18);
            border-radius: 50%;
            width: 27px;
            height: 27px;
            right: 7px;
            top: 7px;
            font-size: 21px;
        }

        .maplibregl-popup-close-button:hover {
            color: #fff;
            background: rgba(0, 0, 0, .35);
        }

        .maplibregl-popup-tip {
            border-top-color: #fff;
        }

        /* Popup thông tin xã */
        .ward-popup {
            min-width: 240px;
            max-width: 340px;
            font-family: Arial, sans-serif;
        }

        .ward-popup-title {
            background: #198754;
            color: white;
            padding: 12px 40px 12px 14px;
            font-size: 16px;
            font-weight: bold;
        }

        .ward-popup-body {
            max-height: 300px;
            overflow-y: auto;
            padding: 8px 12px;
        }

        .ward-popup-row {
            display: grid;
            grid-template-columns: 110px minmax(0, 1fr);
            gap: 8px;
            padding: 7px 0;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .ward-popup-key {
            color: #198754;
            font-weight: bold;
        }

        .ward-popup-value {
            color: #333;
        }

        .maplibregl-popup-content {
            padding: 0;
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <!-- MapLibre GL JS dạng ES module. Đường dẫn này cần tồn tại trong thư mục libs/maplibre. -->
    <script type="module">
        import * as maplibregl from './libs/maplibre/maplibre-gl.mjs';


        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://lifegis-api.lifetex.vn/style.json',
            center: [105.9, 18.3],
            zoom: 9,
            attributionControl: false
        });

        map.addControl(
            new maplibregl.NavigationControl({ visualizePitch: true }),
            'top-right'
        );

        map.addControl(
            new maplibregl.ScaleControl({
                maxWidth: 120,
                unit: 'metric'
            }),
            'bottom-left'
        );

        // Click vào đối tượng trên bản đồ để xem thông tin

        map.on('click', (e) => {
            const features = map.queryRenderedFeatures(e.point);

            // Chỉ lấy polygon thuộc tỉnh Hà Tĩnh
            const feature = features.find((f) =>
                ['fill', 'fill-extrusion'].includes(f.layer.type) &&
                f.properties &&
                f.properties.tenTinh === 'Tỉnh Hà Tĩnh'
            );

            if (!feature) return;

            const properties = feature.properties;

            // Ánh xạ tên trường sang tiếng Việt
            const fieldLabels = {
                tenTinh: 'Tỉnh',
                maTinh: 'Mã tỉnh',
                tenXa: 'Tên xã',
                maXa: 'Mã xã',
                danSo: 'Dân số',
                dienTich: 'Diện tích',
                ghiChu: 'Ghi chú'
            };

            const title = document.createElement('div');
            title.className = 'ward-popup-title';
            title.textContent = properties.tenXa || 'Thông tin xã';

            const body = document.createElement('div');
            body.className = 'ward-popup-body';

            // Chỉ hiển thị các trường cần thiết
            const fields = [
                'tenTinh',
                'maTinh',
                'maXa',
                'danSo',
                'dienTich',
                'ghiChu'
            ];

            fields.forEach((key) => {
                const value = properties[key];

                if (value == null || value === '') return;

                const row = document.createElement('div');
                row.className = 'ward-popup-row';

                const label = document.createElement('div');
                label.className = 'ward-popup-key';
                label.textContent = fieldLabels[key] || key;

                const content = document.createElement('div');
                content.className = 'ward-popup-value';

                // Định dạng dân số và diện tích
                if (key === 'danSo') {
                    content.textContent =
                        Number(value).toLocaleString('vi-VN') + ' người';
                } else if (key === 'dienTich') {
                    content.textContent =
                        Number(value).toLocaleString('vi-VN');
                } else {
                    content.textContent = String(value);
                }

                row.append(label, content);
                body.appendChild(row);
            });

            const container = document.createElement('div');
            container.className = 'ward-popup';
            container.append(title, body);

            new maplibregl.Popup({
                closeButton: true,
                closeOnClick: true,
                maxWidth: '360px'
            })
                .setLngLat(e.lngLat)
                .setDOMContent(container)
                .addTo(map);
        });

        // Đổi con trỏ khi rê chuột lên xã thuộc Hà Tĩnh
        map.on('mousemove', (e) => {
            const features = map.queryRenderedFeatures(e.point);

            const hasHaTinh = features.some((f) =>
                ['fill', 'fill-extrusion'].includes(f.layer.type) &&
                f.properties &&
                f.properties.tenTinh === 'Tỉnh Hà Tĩnh'
            );

            map.getCanvas().style.cursor = hasHaTinh ? 'pointer' : '';
        });

    </script>
</body>

</html>
