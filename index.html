
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WebGIS - Phường xã Hà Tĩnh</title>


    <!-- =========================================
         LEAFLET CSS
         ========================================= -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />


    <!-- =========================================
         CSS
         ========================================= -->

    <style>

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;
        }


        #map {
            width: 100%;
            height: 100vh;
        }


        /* =========================================
           LABEL TRÊN POLYGON
           ========================================= */

        .polygon-label {

            background: transparent;

            border: none;

            box-shadow: none;

            color: #1f2937;

            font-size: 13px;

            font-weight: bold;

            white-space: nowrap;

            text-shadow:
                1px 1px 2px white,
                -1px -1px 2px white,
                1px -1px 2px white,
                -1px 1px 2px white;

            pointer-events: none;
        }


        .polygon-label.label-small {

            font-size: 10px;
        }


        .polygon-label.label-medium {

            font-size: 13px;
        }


        .polygon-label.label-large {

            font-size: 16px;
        }


        .polygon-label.label-hidden {

            display: none;
        }


        /* Bỏ mũi tên của tooltip */

        .leaflet-tooltip.polygon-label::before {
            display: none;
        }


        /* =========================================
           POPUP
           ========================================= */

        .custom-popup {

            min-width: 250px;

            font-family: Arial, sans-serif;
        }


        .popup-title {

            background: #198754;

            color: white;

            font-size: 16px;

            font-weight: bold;

            padding: 10px 12px;

            margin: -12px -12px 10px -12px;

            border-radius: 8px 8px 0 0;
        }


        .popup-body {

            padding: 2px 0;
        }


        .attribute {

            display: flex;

            gap: 8px;

            padding: 6px 0;

            border-bottom: 1px solid #eeeeee;

            font-size: 13px;
        }


        .attribute:last-child {

            border-bottom: none;
        }


        .attribute-key {

            color: #198754;

            font-weight: bold;

            min-width: 90px;
        }


        .attribute-value {

            color: #333333;

            word-break: break-word;
        }


        /* =========================================
           LEAFLET POPUP
           ========================================= */

        .leaflet-popup-content-wrapper {

            border-radius: 8px;

            padding: 0;
        }


        .leaflet-popup-content {

            margin: 12px;
        }

    </style>

</head>


<body>


<!-- =========================================
     MAP
     ========================================= -->

<div id="map"></div>


<!-- =========================================
     LEAFLET JS
     ========================================= -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


// ======================================================
// 1. KHỞI TẠO BẢN ĐỒ
// ======================================================

const map = L.map('map').setView(
    [20.49, 106.26],
    14
);


// ======================================================
// 2. BẢN ĐỒ NỀN OPENSTREETMAP
// ======================================================

const voyager = L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    {
        maxZoom: 20,
        attribution:
            '&copy; OpenStreetMap contributors &copy; CARTO'
    }
);

const satellite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        maxZoom: 19,
        attribution: 'Tiles &copy; Esri'
    }
);

voyager.addTo(map);

L.control.layers({
    'Bản đồ đường phố': voyager,
    'Ảnh vệ tinh': satellite
}).addTo(map);


// ======================================================
// 3. ĐỌC FILE GEOJSON
// ======================================================

fetch('PhuongXaHaTinh.geojson')

    .then(response => {

        // Kiểm tra file có tồn tại không

        if (!response.ok) {

            throw new Error(
                'Không tìm thấy file GeoJSON'
            );
        }

        return response.json();

    })


    .then(data => {


        // ==================================================
        // 4. TẠO LAYER GEOJSON
        // ==================================================

        const layer = L.geoJSON(
            data,
            {


                // ==========================================
                // STYLE BAN ĐẦU
                // ==========================================

                style: function(feature) {

                    return {

                        // Màu viền
                        color: '#198754',

                        // Độ dày viền
                        weight: 2,

                        // Màu nền polygon
                        fillColor: '#7bc8a4',

                        // Độ trong suốt
                        fillOpacity: 1

                    };
                },


                // ==========================================
                // XỬ LÝ TỪNG POLYGON
                // ==========================================

                onEachFeature: function(
                    feature,
                    layer
                ) {


                    // ======================================
                    // LẤY THUỘC TÍNH
                    // ======================================

                    const properties =
                        feature.properties || {};


                    // ======================================
                    // TẠO LABEL
                    // ======================================

                    const label =

                        (properties.loai || '') +
                        ' ' +

                        (properties.ten_xa || '');


                    // ======================================
                    // HIỂN THỊ LABEL
                    // ======================================

                    layer.bindTooltip(

                        label,

                        {

                            // Luôn hiển thị
                            permanent: true,

                            // Nằm giữa polygon
                            direction: 'center',

                            // CSS label
                            className:
                                'polygon-label',

                            opacity: 1

                        }

                    );


                    // ======================================
                    // TẠO POPUP
                    // ======================================

                    let html = `

                        <div class="custom-popup">

                            <div class="popup-title">
                                ${label}
                            </div>

                            <div class="popup-body">

                    `;


                    // ======================================
                    // DUYỆT TẤT CẢ THUỘC TÍNH
                    // ======================================

                    for (
                        const key in properties
                    ) {


                        const value =
                            properties[key];


                        // Bỏ qua giá trị rỗng

                        if (

                            value === null ||

                            value === undefined ||

                            value === ''

                        ) {

                            continue;
                        }


                        html += `

                            <div class="attribute">

                                <div class="attribute-key">
                                    ${key}
                                </div>

                                <div class="attribute-value">
                                    ${value}
                                </div>

                            </div>

                        `;

                    }


                    // ======================================
                    // ĐÓNG POPUP HTML
                    // ======================================

                    html += `

                            </div>

                        </div>

                    `;


                    // ======================================
                    // GẮN POPUP
                    // ======================================

                    layer.bindPopup(

                        html,

                        {
                            maxWidth: 400
                        }

                    );


                    // =================================================
                    // 5. LƯU STYLE BAN ĐẦU
                    // =================================================

                    const originalStyle = {

                        color: '#198754',

                        weight: 2,

                        fillColor: '#7bc8a4',

                        fillOpacity: 1

                    };


                    // =================================================
                    // 6. HIGHLIGHT KHI RÊ CHUỘT VÀO
                    // =================================================

                    layer.on(
                        'mouseover',
                        function() {


                            this.setStyle({

                                // ĐỔI MÀU VIỀN
                                color: '#dc2626',

                                // VIỀN DÀY HƠN
                                weight: 4

                                // Không thay đổi:
                                // fillColor
                                // fillOpacity

                            });


                            // Đưa polygon lên trên

                            this.bringToFront();

                        }
                    );


                    // =================================================
                    // 7. KHI RỜI CHUỘT
                    // =================================================

                    layer.on(
                        'mouseout',
                        function() {


                            // Trả lại đúng style ban đầu

                            this.setStyle(
                                originalStyle
                            );

                        }
                    );


                }

            }

        ).addTo(map);


        // =================================================
        // 8. ĐIỀU CHỈNH LABEL THEO MỨC ZOOM
        // =================================================

        function updateLabelVisibility() {

            const zoom = map.getZoom();

            let labelClass = 'label-hidden';

            if (zoom >= 15) {

                labelClass = 'label-large';

            } else if (zoom >= 13) {

                labelClass = 'label-medium';

            } else if (zoom >= 11) {

                labelClass = 'label-small';
            }

            layer.eachLayer(function(polygon) {

                const tooltip = polygon.getTooltip();

                const element =
                    tooltip && tooltip.getElement();

                if (!element) {

                    return;
                }

                element.classList.remove(
                    'label-hidden',
                    'label-small',
                    'label-medium',
                    'label-large'
                );

                element.classList.add(labelClass);
            });
        }


        map.on('zoomend', updateLabelVisibility);

        updateLabelVisibility();


        // ==================================================
        // 9. ZOOM ĐẾN TOÀN BỘ DỮ LIỆU
        // ==================================================

        const bounds =
            layer.getBounds();


        if (bounds.isValid()) {

            map.fitBounds(
                bounds,
                {
                    padding: [20, 20]
                }
            );

        }


    })


    // ======================================================
    // 9. XỬ LÝ LỖI
    // ======================================================

    .catch(error => {


        console.error(
            'Không thể đọc GeoJSON:',
            error
        );


        alert(
            'Không thể đọc file PhuongXaHaTinh.geojson'
        );

    });


</script>


</body>

</html>
